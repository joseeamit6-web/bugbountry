<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Photo Studio</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #0B1020;
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .container {
        max-width: 480px;
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 16px;
        padding: 36px 28px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .logo-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .badge {
        display: inline-block;
        font-size: 13px;
        font-weight: 600;
        color: #67E8F9;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
      }
      h1 {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #94a3b8;
        margin-bottom: 24px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn-primary {
        background: #67E8F9;
        color: #0B1020;
        border: none;
      }
      .btn-primary:hover {
        background: #22d3ee;
      }
      .btn-secondary {
        background: #1f2937;
        color: #e2e8f0;
        border: 1px solid #374151;
      }
      .btn-secondary:hover {
        background: #374151;
      }
      .redirect-note {
        margin-top: 20px;
        font-size: 12px;
        color: #64748b;
      }
      .countdown-sec {
        color: #67E8F9;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="56" height="56">
          <defs>
            <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0E172E" />
              <stop offset="100%" stop-color="#070B14" />
            </linearGradient>
            <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#67E8F9" />
              <stop offset="100%" stop-color="#06B6D4" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#logoBgGrad)" stroke="#1E293B" stroke-width="2" />
          <circle cx="32" cy="32" r="22" fill="none" stroke="url(#logoCyanGrad)" stroke-width="2.5" opacity="0.9" />
          <circle cx="32" cy="32" r="18" fill="#0B1020" stroke="#334155" stroke-width="1.5" />
          <path d="M 32 14 L 38 24 L 28 24 Z" fill="#67E8F9" opacity="0.85" />
          <path d="M 47 23 L 44 34 L 36 29 Z" fill="#67E8F9" opacity="0.75" />
          <path d="M 47 41 L 36 43 L 39 33 Z" fill="#67E8F9" opacity="0.85" />
          <path d="M 32 50 L 26 40 L 36 40 Z" fill="#67E8F9" opacity="0.75" />
          <path d="M 17 41 L 20 30 L 28 35 Z" fill="#67E8F9" opacity="0.85" />
          <path d="M 17 23 L 28 21 L 25 31 Z" fill="#67E8F9" opacity="0.75" />
          <circle cx="32" cy="32" r="7" fill="#0B1020" stroke="#67E8F9" stroke-width="2" />
          <circle cx="30" cy="30" r="2.5" fill="#FFFFFF" opacity="0.9" />
        </svg>
      </div>
      <span class="badge">404 Error</span>
      <h1>Page Not Found</h1>
      <p>The studio resource or page you requested could not be found. You can return directly to the Photo Studio home to start a new project or resume your photo editing.</p>
      <div class="actions">
        <a href="./" class="btn btn-primary">Return to Photo Studio</a>
        <button onclick="window.history.back()" class="btn btn-secondary">Go Back</button>
      </div>
      <p class="redirect-note" id="redirectText">
        Redirecting to home in <span id="countdown" class="countdown-sec">10</span>s...
        <button onclick="cancelRedirect()" style="background:none; border:none; color:#67E8F9; text-decoration:underline; font-size:12px; cursor:pointer; margin-left:6px;">Cancel</button>
      </p>
    </div>

    <script>
      let secondsLeft = 10;
      let timer = setInterval(() => {
        secondsLeft--;
        const el = document.getElementById('countdown');
        if (el) el.innerText = secondsLeft;
        if (secondsLeft <= 0) {
          clearInterval(timer);
          window.location.href = './';
        }
      }, 1000);

      function cancelRedirect() {
        clearInterval(timer);
        const text = document.getElementById('redirectText');
        if (text) text.innerText = 'Automatic redirect cancelled.';
      }
    </script>
  </body>
</html>
