<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Photo Studio — Passport Photo Maker & Photo Editor</title>
    <meta name="description" content="Create passport photos, edit portraits, replace backgrounds, adjust image sizes, and prepare high-resolution print sheets with Photo Studio." />
    <link rel="canonical" href="https://pic.amitjoshi.info.np/" />
    <meta name="theme-color" content="#0B1020" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pic.amitjoshi.info.np/" />
    <meta property="og:title" content="Photo Studio — Passport Photo Maker & Photo Editor" />
    <meta property="og:description" content="Create passport photos, edit portraits, replace backgrounds, adjust image sizes, and prepare high-resolution print sheets with Photo Studio." />
    <meta property="og:site_name" content="Photo Studio" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Photo Studio — Passport Photo Maker & Photo Editor" />
    <meta name="twitter:description" content="Create passport photos, edit portraits, replace backgrounds, adjust image sizes, and prepare high-resolution print sheets with Photo Studio." />

    <!-- Favicon: Clean aperture/camera SVG icon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <!-- Fonts: Plus Jakarta Sans for UI + JetBrains Mono for tabular metrics -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Photo Studio",
      "url": "https://pic.amitjoshi.info.np/",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "All modern browsers (Chrome, Edge, Safari, Firefox)",
      "description": "Create passport photos, edit portraits, replace backgrounds, adjust image sizes, and prepare high-resolution print sheets with Photo Studio.",
      "browserRequirements": "Requires JavaScript. Requires HTML5 Canvas support.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Amit Joshi",
        "url": "https://pic.amitjoshi.info.np/"
      }
    }
    </script>

    <style>
      /* Strict Print CSS: Hide UI entirely, print ONLY the pristine print canvas at exact size */
      @media print {
        html, body {
          background: #ffffff !important;
          color: #000000 !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
        }
        body * {
          visibility: hidden !important;
        }
        #print-mount-point,
        #print-mount-point * {
          visibility: visible !important;
        }
        #print-mount-point {
          position: absolute !important;
          left: 0 !important;
          top: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          background: #ffffff !important;
          display: block !important;
        }
        @page {
          margin: 0;
          size: auto;
        }
      }
    </style>
  </head>
  <body class="bg-[#0B1020] text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] min-h-screen antialiased selection:bg-cyan-500/20 selection:text-cyan-300">
    <div id="root"></div>
    <!-- Hidden Print mount point for direct window.print() -->
    <div id="print-mount-point" class="hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
